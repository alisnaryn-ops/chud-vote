<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>โหวตชุดในดวงใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* Concept: a snowy cheese-factory village. Wooden signposts are the buttons, three anonymous
   dairy mascots stand on the projector chart, and the reveal happens on a dark stage of gift boxes.
   Single committed look (bright winter day, company yellow + black), so no dark-theme blocks. */
:root{
  --ink:#1d1708; --ink-soft:#4a3d1c;
  --cheese:#ffc62b; --cheese-hi:#ffe57f; --cheese-deep:#e8a000;
  --cream:#fff8e1; --snow:#ffffff; --sky:#bfe7f8; --sky-deep:#86c8e6;
  --coral:#e8553d; --grape:#7b5bd6; --holly:#1f8a56; --berry:#d8412f; --wood:#9a6a33;
  --font-display:"Mitr","Noto Sans Thai",system-ui,sans-serif;
  --font-body:"Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--sky);
  background-image:linear-gradient(180deg,#a8dcf2 0%,#d9f1fb 55%,#f4fbff 100%);
  background-attachment:fixed;
  color:var(--ink);
  font:400 16px/1.55 var(--font-body);
  -webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
button,input{font-family:inherit}
h1,h2,h3,p{margin:0}
svg{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- scene ---------- */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.scene .lights{position:absolute;top:0;left:0;width:100%;height:64px}
.scene .hills{position:absolute;left:0;bottom:0;width:100%;height:26vh;min-height:110px}
.scene .pine{position:absolute;bottom:2vh;width:clamp(70px,9vw,130px)}
.scene .pine.l1{left:1%}.scene .pine.l2{left:7%;bottom:0;width:clamp(50px,6vw,90px)}
.scene .pine.r1{right:1%}.scene .pine.r2{right:7%;bottom:0;width:clamp(50px,6vw,90px)}
@media (max-width:520px){.scene .pine.l2,.scene .pine.r2{display:none}}
#app{position:relative;z-index:1;min-height:100%}
body[data-view=screen] #app{height:100%;min-height:0}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- shared pieces ---------- */
.title{
  font:600 clamp(40px,11vw,68px)/1.25 var(--font-display);
  color:var(--cheese);text-align:center;letter-spacing:.5px;
  text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 7px 0 var(--ink);
}
.title.sm{font-size:clamp(30px,8vw,44px)}
.outlined{
  color:#fff;font-family:var(--font-display);font-weight:600;
  text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),0 6px 0 var(--ink);
}
.sub{text-align:center;font-weight:600;color:var(--ink-soft)}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:18px}
.panel h2{font:500 20px/1.35 var(--font-display)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff;font:600 13px/1.5 var(--font-body)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--holly);border:2px solid var(--ink)}
.chip.off i{background:var(--cheese-deep)}

.plank{
  --c:#ffd24d;--c2:#ffbb12;--t:var(--ink);
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:100%;min-height:64px;padding:12px 18px 16px;
  border:3px solid var(--ink);border-radius:12px 8px 14px 9px/9px 13px 8px 12px;
  background:
    repeating-linear-gradient(176deg,rgba(255,255,255,0) 0 9px,rgba(0,0,0,.06) 9px 11px),
    linear-gradient(var(--c),var(--c2));
  color:var(--t);font:500 22px/1.35 var(--font-display);text-align:center;text-decoration:none;cursor:pointer;
  box-shadow:0 6px 0 var(--ink),inset 0 4px 0 rgba(255,255,255,.4);
  transition:transform .12s,box-shadow .12s;
}
.plank:hover{transform:translateY(-2px)}
.plank:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink),inset 0 4px 0 rgba(255,255,255,.4)}
.plank:focus-visible,.btn:focus-visible,.mini:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.plank[disabled]{filter:grayscale(.9);opacity:.6;cursor:not-allowed;transform:none}
.plank small{font:600 14px/1.4 var(--font-body);opacity:.9}
.plank.row{flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;padding-left:16px}
.plank.row .ico{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center}
.plank.row .ico svg{width:32px;height:32px}
.plank.row .tx{display:flex;flex-direction:column}
.p-yellow{--c:#ffd24d;--c2:#ffbb12}
.p-yellow.holes{background-image:
  radial-gradient(circle at 10% 42%,rgba(150,90,0,.35) 0 7px,transparent 8px),
  radial-gradient(circle at 90% 60%,rgba(150,90,0,.35) 0 9px,transparent 10px),
  radial-gradient(circle at 74% 20%,rgba(150,90,0,.3) 0 5px,transparent 6px),
  repeating-linear-gradient(176deg,rgba(255,255,255,0) 0 9px,rgba(0,0,0,.06) 9px 11px),
  linear-gradient(var(--c),var(--c2))}
.p-ink{--c:#3a3015;--c2:#1d1708;--t:var(--cheese)}
.p-sky{--c:#cfeefb;--c2:#86c8e6}
.p-cream{--c:#fffdf3;--c2:#f1e3b4}
.p-coral{--c:#f0694f;--c2:#d8412f;--t:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.p-grape{--c:#9475ea;--c2:#6a47c9;--t:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.p-green{--c:#3fae74;--c2:#1f8a56;--t:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}

.btn{padding:10px 16px;border:3px solid var(--ink);border-radius:10px;background:var(--cheese);color:var(--ink);font:500 16px/1.3 var(--font-display);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.danger{background:var(--berry);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.mini{padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff;font:600 13px var(--font-body);cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:80;background:var(--ink);color:var(--cheese);padding:10px 18px;border-radius:999px;font:500 15px var(--font-display);transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.wob{animation:wob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.hop{animation:hop 1.1s ease-in-out infinite}

/* ---------- hub ---------- */
.hub{max-width:520px;margin:0 auto;padding-block:36px 56px;display:flex;flex-direction:column;gap:22px}
.hub .cast{display:flex;justify-content:center;gap:4px}
.hub .cast svg{width:min(30vw,128px);height:auto}
.hub .cast svg:nth-child(2){animation-delay:-.9s}.hub .cast svg:nth-child(3){animation-delay:-1.7s}
.hub .signs{display:flex;flex-direction:column;gap:20px}
.hub .signs .plank{align-items:flex-start;text-align:left;padding-left:22px}
.how ol{margin:10px 0 0;padding-left:22px;display:grid;gap:6px}

/* ---------- vote ---------- */
.vote{max-width:480px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:18px}
.vote .hero svg{width:88px;height:auto}
.vote .hero .cast{display:flex;justify-content:center;margin-top:22px}
.vote .rules{font-size:14px;color:var(--ink-soft);text-align:center}
.field label{display:block;font:500 18px var(--font-display);margin-bottom:8px}
.field input{width:100%;padding:14px 16px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:600 22px/1.3 var(--font-body);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:18px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pts{font:500 14px var(--font-display);background:var(--ink);color:var(--cheese);border-radius:999px;padding:3px 14px}
.confirm{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.confirm .big{font:600 30px/1.3 var(--font-display)}
.msg{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;text-align:center}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .cast{display:flex;justify-content:center}
.done .cast svg{width:min(28vw,110px);height:auto}

/* ---------- admin ---------- */
.admin{max-width:760px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:18px}
.admin .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.admin .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.rolebox{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.rolebox b{font:500 22px var(--font-display)}
.rolebox span{display:block;font-size:13px;color:var(--ink-soft)}
.sc{margin-top:14px}
.sc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sc-top b{font:500 19px var(--font-display)}
.sc-top .num{font:600 26px var(--font-display)}
.sc-bar{height:20px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin-top:4px}
.sc-bar i{display:block;height:100%;transition:width .6s}
.sc small{display:block;color:var(--ink-soft);margin-top:4px}
.hide-num .priv{filter:blur(9px);user-select:none}
.alertbox{margin-top:12px;background:#fff0c2;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:600}
.urlrow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-top:10px}
.urlrow input{flex:1 1 220px;min-width:0;padding:10px 12px;border:3px solid var(--ink);border-radius:10px;background:#fff;font:500 14px var(--font-body)}
.qr-box{background:#fff;padding:8px;border:3px solid var(--ink);border-radius:12px;display:inline-block;line-height:0}
.qr-box img,.qr-box canvas{max-width:100%;height:auto}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:2px solid rgba(29,23,8,.15)}
th{font:500 13px var(--font-display);color:var(--ink-soft)}

/* ---------- projector screen ---------- */
body[data-view=screen]{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.stage{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-block:14px 16px;position:relative}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.s-brand .title{text-align:left;font-size:clamp(34px,6.4vw,78px)}
.s-tag{margin-top:2px;font:500 clamp(14px,1.6vw,22px) var(--font-display);color:var(--ink)}
.s-qr{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 12px 8px;transition:opacity .4s,transform .4s}
.s-qr b{font:500 clamp(13px,1.3vw,18px) var(--font-display)}
.s-qr .qr-box{padding:6px;border-width:2px}
.s-qr .qr-box img,.s-qr .qr-box canvas{width:clamp(96px,12vw,170px)!important;height:auto!important}
.stage.in-reveal .s-qr{opacity:0;transform:translateY(-20px)}
.chart{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,3vw,48px);min-height:0;padding-inline:clamp(0px,3vw,60px)}
.grid-lines{position:absolute;left:0;right:0;top:0;bottom:46px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.grid-lines i{display:block;border-top:3px dashed rgba(29,23,8,.18)}
.col{position:relative;min-height:0}
.plot{position:absolute;left:0;right:0;top:0;bottom:46px}
.bar{
  position:absolute;bottom:0;left:50%;width:min(66%,210px);height:var(--h);transform:translateX(-50%);
  border:4px solid var(--ink);border-radius:16px 16px 4px 4px;overflow:hidden;
  transition:height 1.2s cubic-bezier(.2,.9,.25,1.08);
  box-shadow:6px 0 0 rgba(29,23,8,.16);
}
.bar::before{content:"";position:absolute;left:-4px;right:-4px;top:0;height:16px;background:#fff;border-bottom:3px solid var(--ink);border-radius:0 0 18px 18px/0 0 12px 12px;opacity:.95}
.bar .q{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:600 clamp(26px,4.4vw,56px)/1 var(--font-display);color:rgba(29,23,8,.55)}
.s0 .bar{background:
  radial-gradient(circle at 24% 62%,rgba(150,90,0,.35) 0 9px,transparent 10px),
  radial-gradient(circle at 72% 40%,rgba(150,90,0,.35) 0 12px,transparent 13px),
  radial-gradient(circle at 60% 82%,rgba(150,90,0,.3) 0 7px,transparent 8px),
  linear-gradient(90deg,#ffd24d,#ffbb12)}
.s1 .bar{background:linear-gradient(90deg,#d8f1fc,#86c8e6)}
.s2 .bar{background:radial-gradient(circle at 30% 70%,rgba(134,200,230,.55) 0 7px,transparent 8px),radial-gradient(circle at 70% 45%,rgba(134,200,230,.55) 0 9px,transparent 10px),linear-gradient(90deg,#ffffff,#eef6fa)}
.mascot{position:absolute;left:50%;bottom:var(--h);width:min(78%,26vh);transform:translateX(-50%);margin-bottom:-6px;transition:bottom 1.2s cubic-bezier(.2,.9,.25,1.08)}
.mascot svg{width:100%;height:auto}
.mystery .bar{animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.6s)}
.mystery .mascot{animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * -.6s)}
.cname{position:absolute;left:0;right:0;bottom:0;text-align:center;font:500 clamp(16px,2vw,28px)/1.3 var(--font-display);color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:999px;width:fit-content;margin:0 auto;padding:0 18px;box-shadow:0 4px 0 var(--ink)}
.s-foot{display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(255,248,225,.92);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;box-shadow:0 5px 0 var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dot{width:clamp(12px,1.5vw,20px);height:clamp(12px,1.5vw,20px);border-radius:50%;border:2px solid var(--ink);background:#fff;transition:background .35s,transform .35s}
.dot.on{background:var(--cheese);transform:scale(1.15)}
.s-line{display:flex;gap:18px;align-items:baseline;justify-content:center;flex-wrap:wrap;font:500 clamp(14px,1.7vw,24px) var(--font-display)}
.s-line #tick{font:600 clamp(13px,1.4vw,20px) var(--font-body);color:var(--ink-soft)}
.full-banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) rotate(-3deg);z-index:5;background:var(--cheese);border:4px solid var(--ink);border-radius:20px;padding:10px 34px;font:600 clamp(26px,4.6vw,64px)/1.3 var(--font-display);box-shadow:0 8px 0 var(--ink);animation:hop 1.1s ease-in-out infinite;text-align:center}
.tools{position:absolute;left:0;bottom:0;display:flex;gap:8px;opacity:0;transition:opacity .25s;z-index:70}
.tools:hover,.tools:focus-within{opacity:1}
.stage.in-reveal .tools{z-index:90}

/* reveal stage */
.reveal{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6vh 3vw 5vh;
  background:radial-gradient(ellipse at 50% 25%,#4a3a10 0%,#241c07 55%,#120e03 100%)}
.reveal[hidden]{display:none}
.rv-lights{position:absolute;left:0;right:0;top:0;height:64px;background:
  radial-gradient(circle at 50% 22px,var(--cheese) 0 7px,transparent 8px) 0 0/90px 64px repeat-x}
.rv-title{position:absolute;left:0;right:0;top:7vh;text-align:center;font-size:clamp(30px,6vw,86px);line-height:1.3;padding-inline:3vw;color:var(--cheese)}
.rv-sub{position:absolute;left:0;right:0;top:calc(7vh + clamp(40px,8vw,120px));text-align:center;color:#fff;font:500 clamp(18px,2.6vw,38px) var(--font-display);min-height:1.5em}
.rv-sub i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--cheese);margin:0 .25em;animation:hop .6s ease-in-out infinite}
.rv-sub i:nth-child(2){animation-delay:.15s}.rv-sub i:nth-child(3){animation-delay:.3s}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:clamp(10px,3vw,50px);width:min(1180px,100%)}
.slot{display:flex;flex-direction:column;align-items:center;position:relative}
.item{position:relative;width:min(100%,clamp(130px,19vw,270px));aspect-ratio:1/1.05}
.gift{position:absolute;inset:0;width:100%;height:100%;transition:opacity .4s,transform .5s;animation:wob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.slot[data-pos="0"] .gift{animation-delay:-.8s}.slot[data-pos="2"] .gift{animation-delay:-1.6s}
.lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.slot.hot .gift{animation:shake .16s linear infinite;filter:drop-shadow(0 0 28px rgba(255,198,43,.95))}
.slot.hot.big .gift{animation-duration:.1s;filter:drop-shadow(0 0 46px rgba(255,229,127,1))}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-5px,2px) rotate(-4deg)}40%{transform:translate(5px,-2px) rotate(4deg)}60%{transform:translate(-4px,-1px) rotate(-3deg)}80%{transform:translate(4px,2px) rotate(3deg)}100%{transform:translate(0,0) rotate(0)}}
.slot.open .gift{opacity:0;transform:scale(.7) translateY(30px);animation:none}
.slot.open .lid{transform:translate(70px,-340px) rotate(40deg);opacity:0}
.r-card{position:absolute;inset:-6% -14% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);
  opacity:0;transform:scale(.2) translateY(60px);pointer-events:none;transition:opacity .35s,transform .6s cubic-bezier(.2,1.5,.4,1)}
.slot.open .r-card{opacity:1;transform:none}
.r-ico{width:34%;aspect-ratio:1;border-radius:50%;background:var(--tc,var(--cheese));border:4px solid var(--ink);display:grid;place-items:center}
.r-ico svg{width:72%;height:72%}
.r-name{font:600 clamp(18px,2.7vw,40px)/1.25 var(--font-display);padding-inline:8px}
.r-rank{font:500 clamp(13px,1.5vw,22px) var(--font-display);background:var(--ink);color:var(--cheese);border-radius:999px;padding:0 16px}
.r-crown{position:absolute;left:50%;top:-34%;width:44%;transform:translateX(-50%) rotate(-6deg)}
.r-crown svg{width:100%}
.slot[data-pos="0"] .r-card{box-shadow:0 8px 0 var(--ink),0 0 60px 10px rgba(255,198,43,.7)}
.plinth{width:100%;margin-top:14px;border:4px solid var(--ink);border-radius:12px 12px 4px 4px;display:grid;place-items:center;
  background:repeating-linear-gradient(176deg,rgba(255,255,255,0) 0 14px,rgba(0,0,0,.1) 14px 17px),linear-gradient(#b98046,#8a5a2b);box-shadow:inset 0 6px 0 rgba(255,255,255,.25)}
.plinth b{font:600 clamp(40px,7vw,100px)/1 var(--font-display);color:var(--cheese);text-shadow:0 5px 0 var(--ink)}
.plinth.p0{height:clamp(90px,26vh,260px)}.plinth.p1{height:clamp(66px,19vh,190px)}.plinth.p2{height:clamp(46px,13vh,130px)}
.rv-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

var pollT=null,lastSig='';
function startPoll(){
  clearTimeout(pollT);
  (async function loop(){
    var delay=S.isAdmin?1500:4000,ok=true;
    if(!inflight&&Date.now()-lastWrite>1500){
      try{
        if(S.isAdmin){
          var r=await apiFetch('/api/state',{headers:{'X-Admin-Key':S.key},cache:'no-store'});
          if(r.status===401){S.isAdmin=false;S.isOwner=false;S.key='';notify();mount()}
          else if(r.ok){var j=await r.json();if(!inflight&&Date.now()-lastWrite>1500){var sg=JSON.stringify(j);if(sg!==lastSig){lastSig=sg;applyState(j);notify()}}}
          else ok=false}
        else{
          var r2=await apiFetch('/api/public?id='+encodeURIComponent(localId()),{cache:'no-store'});
          if(r2.ok){var j2=await r2.json();var sg2=JSON.stringify(j2);if(sg2!==lastSig){lastSig=sg2;applyPublic(j2);notify()}}else ok=false}
      }catch(e){ok=false}
      if(S.online!==ok){S.online=ok;notify()}}
    pollT=setTimeout(loop,delay)})()}

/* ---------- scoring ---------- */
function tally(){
  var t=TEAMS.map(function(){return {score:0,n:0,by:{employee:0,director:0,staff:0,guest:0}}}),valid=0,rejected=0;
  Object.keys(S.votes).forEach(function(k){var v=S.votes[k];var i=TEAMS.findIndex(function(x){return x.id===v.pick});
    if(i<0||!ROLES[v.role]||(v.role==='employee'&&v.team===v.pick)){rejected++;return}
    var w=ROLES[v.role].w;t[i].score+=w;t[i].n++;t[i].by[v.role]+=w;valid++});
  return {t:t,valid:valid,rejected:rejected}}
function ranking(){
  var r=tally(),t=r.t;
  var order=[0,1,2].sort(function(a,b){return t[b].score-t[a].score||t[b].n-t[a].n||a-b});
  var rank=[0,0,0],tied=[false,false,false];
  [0,1,2].forEach(function(i){rank[i]=1+t.filter(function(x){return x.score>t[i].score}).length;tied[i]=t.some(function(x,j){return j!==i&&x.score===t[i].score})});
  return {t:t,order:order,rank:rank,tied:tied,valid:r.valid,rejected:r.rejected}}

async function makePoster(url){

  g.font='500 50px '+F;g.fillStyle=INK;g.fillText('โหวตทีมที่แต่งชุดโดนใจที่สุด',cw/2,292);
  g.font='500 38px '+F;g.fillText('Christmas & New Year 2027',cw/2,342);

  function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
  g.fillStyle=INK;rr(110,616+12,860,740,36);g.fill();g.fillStyle='#fff8e1';rr(110,616,860,740,36);g.fill();g.lineWidth=10;g.strokeStyle=INK;g.stroke();
  var tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(tmp);

  g.fillStyle='#fff';rr(190,656,700,660,20);g.fill();

  document.body.removeChild(tmp);

  g.fillStyle=INK;g.font='600 64px '+F;g.fillText('สแกนเพื่อโหวต',cw/2,1460);

  g.textBaseline='alphabetic';g.fillText(t,cw/2,1540);

    $('.r-ico',slot).style.setProperty('--tc',t.color);return slot}
  function setTitle(s){rvTitle.textContent=s;rvTitle.className='rv-title outlined';rvTitle.style.color='var(--cheese)'}
  function flash(){flashEl.classList.remove('on');void flashEl.offsetWidth;flashEl.classList.add('on')}
  function setInstant(upTo){
    var rk=ranking();
    [0,1,2].forEach(function(pos){var s=3-pos,slot=$('.slot[data-pos="'+pos+'"]',root);
      if(s<=upTo){fillSlot(pos,rk);slot.classList.add('open')}else slot.classList.remove('open');slot.classList.remove('hot','big')});
    idleTitle(upTo,rk)}
  function idleTitle(step,rk){
    if(step===0){setTitle('ถึงเวลาลุ้นแล้ว!');rvSub.textContent=''}
    else if(step===1){setTitle('เหลืออีก 2 กล่อง…');rvSub.textContent=''}
    else if(step===2){setTitle('เหลืออีก 1 กล่อง… ใครจะชนะ?');rvSub.textContent=''}
    else{var ti=rk.order[0];setTitle('ทีม'+TEAMS[ti].name+' ชนะชุดในดวงใจ!');rvSub.textContent=''}}

  async function playOpen(s){
    var pos=3-s,rk=ranking(),big=pos===0,slot=fillSlot(pos,rk),ti=rk.order[pos];
    revealBusy=true;rv.classList.add('spot');slot.classList.add('hot');if(big)slot.classList.add('big');
    setTitle(labelFor(pos,rk)+' คือ…');rvSub.innerHTML='<i></i><i></i><i></i>';
    drumroll(big?4.8:3.1);
    await sleep(big?2700:1900);if(!alive()){revealBusy=false;return}
    if(big){setTitle('ลุ้นกันให้สุดเลย…');await sleep(1900)}else await sleep(1100);
    if(!alive()){revealBusy=false;return}
    flash();slot.classList.remove('hot','big');slot.classList.add('open');rv.classList.remove('spot');
    var b=slot.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height*.35;
    burst(cx,cy,big?170:100,{speed:big?17:13,life:big?150:120});fanfare(big);
    if(big){setTimeout(function(){burst(W*.2,H*.55,70,{radial:true,speed:11,g:.18,shape:'circle',size:9})},350);setTimeout(function(){burst(W*.8,H*.55,70,{radial:true,speed:11,g:.18,shape:'circle',size:9})},650);setTimeout(function(){burst(W*.5,H*.3,90,{radial:true,speed:14,g:.2,shape:'circle',size:9})},950)}
    rvSub.textContent='';
    setTitle(big?'ทีม'+TEAMS[ti].name+' ชนะชุดในดวงใจ!':'ยินดีด้วย ทีม'+TEAMS[ti].name);
    await sleep(big?1600:1000);
    revealBusy=false}

  async function syncReveal(){
    var m=S.meta,on=m.phase==='reveal';
    stage.classList.toggle('in-reveal',on);
    if(on!==wasReveal){wasReveal=on;rv.hidden=!on;
      if(on){shown=m.step;setInstant(m.step);if(m.step===0){fanfare(false);burst(W/2,H*.5,60,{})}}
      else{revealBusy=false}}
    if(!on)return;
    if(m.step>shown&&!revealBusy){while(shown<S.meta.step&&alive()){shown++;await playOpen(shown)}}
    else if(m.step<shown&&!revealBusy){shown=m.step;setInstant(m.step)}}

  function update(){
    if(S.mode==='http'&&!S.isAdmin&&S.votesReady){var t=$('#tick',root);t.textContent='หน้านี้สำหรับผู้จัดงานเท่านั้น'}
    var rk=ranking(),m=S.meta,keys=Object.keys(S.votes),n=keys.length;
    var denom=Math.max(Math.max.apply(null,rk.t.map(function(x){return x.score}))*1.15,12);
    $$('.col',root).forEach(function(col,i){var ti=m.perm[i],h=m.hideBars?46:8+(rk.t[ti].score/denom)*44;
      $$('.bar,.mascot',col).forEach(function(el){el.style.setProperty('--h',h.toFixed(1)+'%')})});
    $('#chart',root).classList.toggle('mystery',!!m.hideBars);
    var dots=$$('.dot',root);dots.forEach(function(d,i){d.classList.toggle('on',i<n)});
    $('#cnt',root).textContent=Math.min(n,EXPECTED)+' / '+EXPECTED+' คน';
    var last=keys.map(function(k){return S.votes[k]}).sort(function(a,b){return (b.t||0)-(a.t||0)}).slice(0,3).map(function(v){return v.name});
    if(!(S.mode==='http'&&!S.isAdmin&&S.votesReady))$('#tick',root).textContent=last.length?'ล่าสุด: '+last.join(' · ')+' โหวตแล้ว':'รอผู้ร่วมงานสแกน QR Code';
    $('#fullB',root).hidden=!(n>=EXPECTED&&m.phase!=='reveal');
    var u=shareUrl();if(u!==lastQR){lastQR=u;drawQR($('#qrBox',root),u,170)}
    syncReveal()}

  function onKey(e){
    var k=e.key;if(e.target&&e.target.tagName==='INPUT')return;
    if(k===' '||k==='Enter'||k==='ArrowRight'||k==='PageDown'){e.preventDefault();ac();advance()}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();retreat()}
    else if(k==='Escape'){toChart()}
    else if(k==='f'||k==='F'){toggleFull()}
    else if(k==='s'||k==='S'){toggleSound()}}
  function toggleFull(){try{if(document.fullscreenElement){document.exitFullscreen()}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){toast('เบราว์เซอร์ไม่อนุญาตให้เต็มจอ')})}else toast('เบราว์เซอร์ไม่รองรับเต็มจอ')}catch(e){toast('เต็มจอไม่ได้ในหน้านี้')}}
  function toggleSound(){soundOn=!soundOn;$('#tSnd',root).textContent='เสียง: '+(soundOn?'เปิด':'ปิด')+' (S)';if(soundOn)ac()}
  document.addEventListener('keydown',onKey);
  $('#tFull',root).addEventListener('click',toggleFull);$('#tSnd',root).addEventListener('click',toggleSound);
  $('#tNext',root).addEventListener('click',function(){ac();advance()});
  $('#tSnd',root).textContent='เสียง: '+(soundOn?'เปิด':'ปิด')+' (S)';
  return {update:update,rebuild:function(){lastQR='';update()},destroy:function(){dead=true;revealBusy=false;document.removeEventListener('keydown',onKey)}}};

/* ---------- boot ---------- */
detect().then(function(){mount()});
})();
</script>
</body></html>
